name: Application CI

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "src/**"
      - "tests/**"
      - "tsconfig*.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "src/**"
      - "tests/**"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser QA
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run health, readiness, and API smoke checks
        shell: bash
        env:
          PORT: "3000"
          STORAGE_BACKEND: memory
        run: |
          set -euo pipefail
          npm start > application.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat application.log' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Application exited before becoming healthy."
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Health endpoint did not become ready within 30 seconds."
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/ready >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/products >/dev/null
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-smoke-diagnostics
          path: application.log
          if-no-files-found: ignore

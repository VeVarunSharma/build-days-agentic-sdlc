name: Deploy Babazon to Azure

on:
  workflow_dispatch:
    inputs:
      teamId:
        description: Lowercase team identifier used by Bicep
        required: true
        type: string
      pullRequestNumber:
        description: Pull request whose same-repository head is deployed
        required: true
        type: number

permissions: {}
concurrency:
  group: workshop-deployment-${{ inputs.teamId }}
  cancel-in-progress: false

jobs:
  validate-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      pull_request_number: ${{ steps.validate.outputs.pull_request_number }}
      required_checks: ${{ steps.validate.outputs.required_checks }}
      security_checks: ${{ steps.validate.outputs.security_checks }}
    steps:
      - name: Validate pull request, commit, and checks
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pullRequestNumber }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_repository="$(jq -r '.head.repo.full_name // empty' <<< "$pr")"
          [ "$head_repository" = "$REPOSITORY" ] || { echo "::error::Pull request must use a branch in $REPOSITORY."; exit 1; }
          [ "$DEPLOYED_SHA" = "$head_sha" ] || { echo "::error::Selected commit $DEPLOYED_SHA is not the current head $head_sha of pull request #$PR_NUMBER."; exit 1; }
          required_checks="$(gh pr checks "$PR_NUMBER" --required --json name,state,workflow,bucket,link)"
          jq -e 'length > 0 and all(.[]; .bucket == "pass")' <<< "$required_checks" >/dev/null
          all_checks="$(gh pr checks "$PR_NUMBER" --json name,state,workflow,bucket,link)"
          security_checks="$(jq -c '[.[] | select(((.workflow // "") | test("codeql|dependency review"; "i")) or ((.name // "") | test("codeql|dependency review|analyze javascript"; "i")))]' <<< "$all_checks")"
          jq -e 'length == 0 or all(.[]; .bucket == "pass")' <<< "$security_checks" >/dev/null
          echo "pull_request_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "required_checks=$(jq -c '{status:"passed",count:length,checks:map({name,workflow,state})}' <<< "$required_checks")" >> "$GITHUB_OUTPUT"
          echo "security_checks=$(jq -c '{status:(if length == 0 then "not_run" else "passed" end),count:length,checks:map({name,workflow,state})}' <<< "$security_checks")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate-linkage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: workshop
      url: ${{ steps.infrastructure.outputs.application_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - name: Build and test application
        run: npm ci && npm run check && npm prune --omit=dev
      - name: Create deployment package
        run: zip -r app.zip dist package.json package-lock.json node_modules
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        env:
          TEAM_ID: ${{ inputs.teamId }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
          FOUNDRY_SUBSCRIPTION_ID: ${{ vars.FOUNDRY_SUBSCRIPTION_ID }}
          FOUNDRY_RESOURCE_GROUP_NAME: ${{ vars.FOUNDRY_RESOURCE_GROUP_NAME }}
          FOUNDRY_ACCOUNT_NAME: ${{ vars.FOUNDRY_ACCOUNT_NAME }}
          FOUNDRY_PROJECT_NAME: ${{ vars.FOUNDRY_PROJECT_NAME }}
        run: |
          set -euo pipefail
          [[ "$TEAM_ID" =~ ^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$ ]]
          foundry_values=("$FOUNDRY_PROJECT_ENDPOINT" "$FOUNDRY_AGENT_NAME" "$FOUNDRY_SUBSCRIPTION_ID" "$FOUNDRY_RESOURCE_GROUP_NAME" "$FOUNDRY_ACCOUNT_NAME" "$FOUNDRY_PROJECT_NAME")
          foundry_value_count=0
          for value in "${foundry_values[@]}"; do [ -z "$value" ] || foundry_value_count=$((foundry_value_count + 1)); done
          if [ "$foundry_value_count" -ne 0 ] && [ "$foundry_value_count" -ne "${#foundry_values[@]}" ]; then
            echo "::error::Foundry deployment variables must be either all configured or all unset."
            exit 1
          fi
          deployment="$(az deployment group create --name "workshop-${GITHUB_RUN_ID}" --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep --parameters infra/main.example.bicepparam teamIdentifier="$TEAM_ID" foundryProjectEndpoint="$FOUNDRY_PROJECT_ENDPOINT" foundryAgentName="$FOUNDRY_AGENT_NAME" foundrySubscriptionId="$FOUNDRY_SUBSCRIPTION_ID" foundryResourceGroupName="$FOUNDRY_RESOURCE_GROUP_NAME" foundryAccountName="$FOUNDRY_ACCOUNT_NAME" foundryProjectName="$FOUNDRY_PROJECT_NAME" --output json)"
          app_name="$(jq -r '.properties.outputs.appName.value // empty' <<< "$deployment")"
          app_url="$(jq -r '.properties.outputs.appUrl.value // empty' <<< "$deployment")"
          deployment_name="$(jq -r '.name // empty' <<< "$deployment")"
          foundry_configured="$(jq -r '.properties.outputs.foundryConfigured.value' <<< "$deployment")"
          [ -n "$app_name" ] && [ -n "$app_url" ] && [ -n "$deployment_name" ] && [[ "$foundry_configured" =~ ^(true|false)$ ]]
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "application_url=${app_url%/}" >> "$GITHUB_OUTPUT"
          echo "deployment_name=$deployment_name" >> "$GITHUB_OUTPUT"
          echo "foundry_configured=$foundry_configured" >> "$GITHUB_OUTPUT"
      - name: Deploy application package
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ steps.infrastructure.outputs.app_name }}" --src-path app.zip --type zip --clean true --restart true
      - name: Verify deployed health, readiness, catalogue, search, filter, and page
        id: verify
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          FOUNDRY_CONFIGURED: ${{ steps.infrastructure.outputs.foundry_configured }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do curl --fail --silent "$APPLICATION_URL/health" >/dev/null && break; [ "$attempt" -lt 36 ] || exit 1; sleep 10; done
          curl --fail --silent "$APPLICATION_URL/ready" >/dev/null
          catalogue="$(curl --fail --silent "$APPLICATION_URL/api/products")"
          jq -e '.items | length > 0' <<< "$catalogue" >/dev/null
          search="$(curl --fail --silent --get --data-urlencode 'q=lamp' "$APPLICATION_URL/api/products")"
          jq -e '.query.q == "lamp" and (.items | type == "array")' <<< "$search" >/dev/null
          category="$(curl --fail --silent --get --data-urlencode 'category=home' "$APPLICATION_URL/api/products")"
          jq -e '.query.category == "home" and all(.items[]; .category == "home")' <<< "$category" >/dev/null
          curl --fail --silent "$APPLICATION_URL/" | grep -qi '<html'
          mission_planner_verified=false
          if [ "$FOUNDRY_CONFIGURED" = "true" ]; then
            mission="$(curl --fail --silent --request POST --header 'content-type: application/json' --data '{"goal":"Create a productive desk setup","budgetCents":10000,"maxItems":3}' "$APPLICATION_URL/api/shopping-missions")"
            jq -e '.plan.items | length > 0' <<< "$mission" >/dev/null
            mission_planner_verified=true
          fi
          echo "mission_planner_verified=$mission_planner_verified" >> "$GITHUB_OUTPUT"
      - name: Create machine-readable deployment evidence
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          DEPLOYMENT_NAME: ${{ steps.infrastructure.outputs.deployment_name }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
          REQUIRED_CHECKS: ${{ needs.validate-linkage.outputs.required_checks }}
          SECURITY_CHECKS: ${{ needs.validate-linkage.outputs.security_checks }}
          FOUNDRY_CONFIGURED: ${{ steps.infrastructure.outputs.foundry_configured }}
          MISSION_PLANNER_VERIFIED: ${{ steps.verify.outputs.mission_planner_verified }}
        run: |
          jq -c -n --arg commit_sha "$GITHUB_SHA" --argjson pull_request_number "$PR_NUMBER" --argjson required_checks "$REQUIRED_CHECKS" --argjson security_checks "$SECURITY_CHECKS" --arg deployment_name "$DEPLOYMENT_NAME" --arg github_run_id "$GITHUB_RUN_ID" --arg application_url "$APPLICATION_URL" --argjson foundry_configured "$FOUNDRY_CONFIGURED" --argjson mission_planner_verified "$MISSION_PLANNER_VERIFIED" --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{schema_version:1,commit_sha:$commit_sha,pull_request_number:$pull_request_number,required_checks:$required_checks,security_checks:$security_checks,deployment_name:$deployment_name,github_run_id:$github_run_id,environment:"workshop",application_url:$application_url,foundry:{configured:$foundry_configured,system_assigned_identity:true,agent_consumer_role_assigned:$foundry_configured,mission_planner_smoke:$mission_planner_verified,endpoint_included:false},verification:{health:true,readiness:true,catalogue:true,search:true,category_filter:true,page:true},workflow_run_url:$workflow_run_url}' > deployment-evidence.json
          jq -e '.required_checks.status == "passed" and (.security_checks.status == "passed" or .security_checks.status == "not_run") and ([.verification[]] | all) and .foundry.system_assigned_identity and (.foundry.endpoint_included | not) and (if .foundry.configured then .foundry.agent_consumer_role_assigned and .foundry.mission_planner_smoke else (.foundry.agent_consumer_role_assigned | not) and (.foundry.mission_planner_smoke | not) end)' deployment-evidence.json >/dev/null
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-pr-${{ needs.validate-linkage.outputs.pull_request_number }}-${{ github.sha }}
          path: deployment-evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-evidence:
    needs: [validate-linkage, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-evidence-pr-${{ needs.validate-linkage.outputs.pull_request_number }}-${{ github.sha }}
          path: deployment-evidence
      - name: Create or update pull-request evidence comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          evidence_path='deployment-evidence/deployment-evidence.json'
          marker='<!-- workshop-deployment-evidence -->'
          body="$marker
          ## Verified deployment evidence
          - Commit: $(jq -r '.commit_sha' "$evidence_path")
          - Azure deployment: $(jq -r '.deployment_name' "$evidence_path")
          - Live checks: health, readiness, catalogue, search, category filter, and page availability passed
          - Foundry mission planner: $(jq -r 'if .foundry.configured then "configured; managed identity, role assignment, and mission smoke verified" else "unconfigured; generic deployment preserved" end' "$evidence_path")
          - Application: $(jq -r '.application_url' "$evidence_path")
          - Workflow: $(jq -r '.workflow_run_url' "$evidence_path")"
          comment_id="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          if [ -n "$comment_id" ]; then gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - <<< "$payload"; else gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input - <<< "$payload"; fi

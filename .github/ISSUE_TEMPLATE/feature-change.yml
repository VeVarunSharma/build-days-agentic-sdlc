name: Outcome change
description: Define one user outcome and its observable acceptance criteria.
title: "[Outcome]: "
labels: ["feature", "planning"]
body:
  - type: markdown
    attributes:
      value: |
        Review a Copilot App Plan and create exactly four bounded child issues
        before implementation.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible outcome and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
      description: List measurable success, empty, validation, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Copilot App Plan review
      description: Summarize the reviewed architecture, shared foundations, and decisions.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and risks
      description: Note dependencies, security considerations, explicit non-goals, and task boundaries.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Bounded child issues
      description: Link exactly four child issues and summarize their dependencies plus owned/prohibited paths.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Identify tests, checks, deployment proof, or screenshots needed for review.
    validations:
      required: true
